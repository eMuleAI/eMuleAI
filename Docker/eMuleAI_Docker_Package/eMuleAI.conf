# eMule AI Docker launcher configuration.
# Use KEY=value syntax with no spaces around the equals sign.
# Lines beginning with # are comments. Empty values are allowed where documented.

# Selects the image source. Use registry to check Docker Hub for updates or local to use a locally built image without contacting Docker Hub.
IMAGE_SOURCE=registry

# Docker Hub repository used when IMAGE_SOURCE=registry.
REGISTRY_IMAGE=emuleai/emuleai

# Docker Hub tag used when IMAGE_SOURCE=registry. latest is recommended for normal users.
REGISTRY_TAG=latest

# Local Docker repository used when IMAGE_SOURCE=local.
LOCAL_IMAGE=emuleai/emuleai

# Local Docker tag used when IMAGE_SOURCE=local. dockerize.bat creates the local tag by default.
LOCAL_TAG=local

# Removes older tags and unused image IDs from the selected repository after the new container starts successfully. Values: yes or no.
CLEAN_OLD_IMAGES=yes

# Name assigned to the Docker container.
CONTAINER_NAME=eMuleAI

# Docker target platform. Keep linux/amd64 unless a native image for another architecture is published.
PLATFORM=linux/amd64

# Selects the graphical access method. Values: xpra or novnc.
DISPLAY_MODE=xpra

# Persistent data directory on Windows. Supported leading placeholders: {LOCALAPPDATA}, {USERPROFILE}, {PROGRAMFILES} and {PROGRAMFILESX86}.
DATA_DIR_WINDOWS={LOCALAPPDATA}\eMuleAI

# Persistent data directory on Linux. $HOME and ${HOME} are expanded by Linux.sh.
DATA_DIR_LINUX=$HOME/.local/share/eMuleAI

# Persistent data directory on macOS. $HOME and ${HOME} are expanded by macOS.command.
DATA_DIR_MACOS=$HOME/Library/Application Support/eMuleAI

# Container user ID on Windows. Use a non-negative integer. auto resolves to 1000.
PUID_WINDOWS=1000

# Container group ID on Windows. Use a non-negative integer. auto resolves to 1000.
PGID_WINDOWS=1000

# Container user ID on Linux. Use auto to match the current host user or specify a non-negative integer.
PUID_LINUX=auto

# Container group ID on Linux. Use auto to match the current host group or specify a non-negative integer.
PGID_LINUX=auto

# Container user ID on macOS. Use auto to match the current host user or specify a non-negative integer.
PUID_MACOS=auto

# Container group ID on macOS. Use auto to match the current host group or specify a non-negative integer.
PGID_MACOS=auto

# Host address used to publish Xpra or noVNC. 127.0.0.1 limits access to the local computer. Use 0.0.0.0 only when remote access is intentionally required.
DISPLAY_BIND_ADDRESS=127.0.0.1

# Address used by the local launcher and Xpra client to connect to the published display port. Usually 127.0.0.1.
DISPLAY_CONNECT_ADDRESS=127.0.0.1

# Host address used to publish eMule TCP and UDP ports. 0.0.0.0 accepts connections on all host network interfaces.
EMULE_BIND_ADDRESS=0.0.0.0

# Xpra TCP port. Valid range: 1-65535.
XPRA_PORT=14500

# noVNC HTTP port. Valid range: 1-65535.
NOVNC_PORT=6080

# eMule TCP listening port. Valid range: 1-65535.
EMULE_TCP_PORT=4662

# eMule UDP listening port. Valid range: 0-65535. Use 0 to disable the UDP mapping.
EMULE_UDP_PORT=4672

# noVNC virtual desktop width. Valid range: 320-8192.
DISPLAY_WIDTH=1280

# noVNC virtual desktop height. Valid range: 320-8192.
DISPLAY_HEIGHT=800

# Xpra seamless coordinate-space width. Keep this at least as wide as the host desktop. Valid range: 320-8192.
XPRA_CANVAS_WIDTH=7680

# Xpra seamless coordinate-space height. Keep this at least as tall as the host desktop. Valid range: 320-8192.
XPRA_CANVAS_HEIGHT=4320

# Virtual display color depth. Values: 16 or 24.
DISPLAY_DEPTH=24

# Xpra authentication password. Change this before publishing Xpra beyond localhost. Line breaks are not allowed.
XPRA_PASSWORD=emuleai

# Username included in the Xpra connection URL.
XPRA_USERNAME=emuleai

# Starts the installed Xpra desktop client automatically after an Xpra container becomes ready. Values: yes or no.
AUTO_ATTACH_XPRA=yes

# Optional full path to Xpra.exe on Windows. Leave empty for automatic detection. The Windows path placeholders listed for DATA_DIR_WINDOWS are supported.
XPRA_CLIENT_EXE_WINDOWS=

# Optional full path to the Xpra client on Linux. Leave empty to search PATH. $HOME and ${HOME} are supported.
XPRA_CLIENT_EXE_LINUX=

# Optional full path to the Xpra client or Xpra application executable on macOS. Leave empty for automatic detection. $HOME and ${HOME} are supported.
XPRA_CLIENT_EXE_MACOS=

# Windows Xpra client backend. gtk avoids known pointer-coordinate problems in the experimental native backend. Values: gtk, win32 or auto.
XPRA_CLIENT_BACKEND_WINDOWS=gtk

# Xpra client desktop scaling. off keeps window and pointer coordinates at a 1:1 ratio. Values: off, on or auto.
XPRA_DESKTOP_SCALING=off

# Shared-memory size assigned to the container. Docker size suffixes such as m and g are supported, for example 256m or 1g.
SHM_SIZE=256m

# Docker restart policy. no keeps eMule AI closed after the application exits. Other Docker values include unless-stopped, always and on-failure.
RESTART_POLICY=no
